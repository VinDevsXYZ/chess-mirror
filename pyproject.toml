[project]
name = "chessmirror"
version = "0.1.0"
description = "Personal Chess Mirror: a UCI engine that learns and imitates one player's style"
authors = [
    { name = "Ahmed Alshafee", email = "ahmed.medhat.alshafei@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "numpy>=2.5.3",
    "pywebview>=6.2.1",
    "scipy>=1.18.1",
]

[project.scripts]
mirror = "chessmirror.cli:main"
mirror-engine = "chessmirror.uci.engine:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
